[sdl]
fullscreen=false
output=surface
autolock=false
clip_mouse_button=none

[dosbox]
machine=svga_s3
memsize=16
gdbserver=true
gdbserver port=2159
qmpserver=true
qmpserver port=4444

[cpu]
core=normal
cputype=386
cycles=fixed 10000

[mixer]
nosound=true

[midi]
mididevice=none

[serial]
serial1=disabled
serial2=disabled
serial3=disabled
serial4=disabled

[parallel]
parallel1=disabled
parallel2=disabled
parallel3=disabled

[printer]
printer=false

[ipx]
ipx=false

[ne2000]
ne2000=false

[dos]
automount=false
automountall=false
automount drive directories=false
startcmd=false
dos clipboard device enable=false
dos clipboard api=false
vmware=false

[autoexec]
imgmount 2 "scratch/run-001/dos.img" -t hdd -fs none -size 512,63,2,520
boot -l c
